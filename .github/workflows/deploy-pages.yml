name: Deploy TradingView Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Dashboard Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'dashboard/'

      - name: Wait for Artifact Indexing
        run: sleep 6

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 5

      - name: Wait Before Retry on Transient API Delay
        if: steps.deployment.outcome != 'success'
        run: sleep 15

      - name: Retry Deploy to GitHub Pages
        id: deployment_retry
        if: steps.deployment.outcome != 'success'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 5
